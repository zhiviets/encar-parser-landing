name: Weekly ENCAR scrape

on:
  schedule:
    # Пока каталог не заполнен (5500 машин), прогоны идут друг за другом без остановки: каждый
    # в конце запускает следующий (шаг «Next fill run»); расписание — страховка, если цепочка
    # оборвётся. После заполнения — обновление по понедельникам и четвергам (первый прогон дня,
    # порции по 150 с паузой 30 минут), в остальное время прогон сразу заканчивается.
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:
    inputs:
      total:
        description: "Сколько новых машин добавить (0 — само: заполнение до 5500, потом 2 раза в неделю)"
        default: "0"

# Один прогон за раз: запуск по расписанию ждёт, пока закончится предыдущий
# (два параллельных прогона — двойная нагрузка на сайт-источник и риск блокировки)
concurrency:
  group: encar-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # До 1000 машин порциями по 100 с паузой 1–2 минуты между ними плюс
    # поиск по всем моделям — до 6 часов, это предел GitHub
    timeout-minutes: 355
    # contents: write — сохранить cars.json и кэш drom; actions: write — запустить следующий прогон
    permissions:
      contents: write
      actions: write
    steps:
      # Время старта — шаг «Next fill run» по нему отличает падение сразу при старте
      - name: Remember start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: scraper
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper and push to bn-auto
        working-directory: scraper
        env:
          PYTHONIOENCODING: utf-8
          # Лог виден сразу, а не только после завершения
          PYTHONUNBUFFERED: "1"
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # 0 — само: до заполнения каталога по 1000 за прогон без остановки, потом 2 раза в неделю
          ENCAR_TOTAL: ${{ inputs.total || '0' }}
        run: |
          python scraper.py

      # Всегда, не только при ошибке: там сырые ответы API encar и сетевой
      # лог одной карточки — по ним дорабатывается разбор и справочник опций.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encar-debug
          path: scraper/debug
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/cars.json
          [ -f scraper/drom_cache.json ] && git add -f scraper/drom_cache.json
          git commit -m "chore: weekly data update [skip ci]" || { echo "No changes"; exit 0; }
          # Пока шёл сбор (часы), в main могли появиться другие коммиты — подтягиваем их
          # и пробуем ещё раз. cars.json меняет только этот шаг, конфликтов не будет.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Next fill run
        # Следующий прогон — и после ошибки (сайт не ответил, сбой), иначе цепочка стоит до
        # расписания. Но если прогон упал раньше 20 минут — ошибка при старте, её перезапуск
        # ничего не даст: ждём расписания, чтобы не крутить падения по кругу.
        if: ${{ !cancelled() && hashFiles('scraper/continue_fill') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_STARTED:-0} ))
          if [ "$JOB_STATUS" != "success" ] && [ "$elapsed" -lt 1200 ]; then
            echo "Прогон упал через $((elapsed / 60)) мин — следующий не запускаем, ждём расписания"
            exit 0
          fi
          gh workflow run scrape.yml --ref main -R ${{ github.repository }}
