name: Weekly ENCAR scrape

on:
  schedule:
    # Понедельник и четверг, 03:00 UTC (13:00 по Владивостоку)
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
    inputs:
      total:
        description: "Сколько машин собрать (60 % популярные марки, 40 % премиум)"
        default: "1000"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 1000 машин с паузами «как человек»: первый прогон 2–3 часа, дальше
    # быстрее — машины, которые уже есть на сайте, у encar не запрашиваются
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: scraper
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper and push to bn-auto
        working-directory: scraper
        env:
          PYTHONIOENCODING: utf-8
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # 1000 машин: по расписанию и по умолчанию при ручном запуске (в поле можно указать меньше)
          ENCAR_TOTAL: ${{ inputs.total || '1000' }}
        run: |
          python scraper.py

      # Всегда, не только при ошибке: там сырые ответы API encar и сетевой
      # лог одной карточки — по ним дорабатывается разбор и справочник опций.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encar-debug
          path: scraper/debug
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/cars.json
          git commit -m "chore: weekly data update [skip ci]" || echo "No changes"
          git push
