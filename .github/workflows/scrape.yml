name: Weekly ENCAR scrape

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: scraper
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: scraper
        run: |
          python -m playwright install --with-deps firefox

      - name: Run scraper and push to bn-auto
        working-directory: scraper
        env:
          PYTHONIOENCODING: utf-8
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
        run: |
          python scraper.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: encar-debug
          path: scraper/debug
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/cars.json
          git commit -m "chore: weekly data update [skip ci]" || echo "No changes"
          git push
