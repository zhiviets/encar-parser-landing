name: Weekly ENCAR scrape

on:
  schedule:
    # Каждый день в 01:00 UTC (11:00 по Владивостоку). Пока каталог не заполнен (5500 машин) —
    # до 1000 новых за прогон; потом новые — раз в неделю (понедельник), в остальные дни только
    # отметки «ещё в продаже» и проверка давно не встречавшихся
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      total:
        description: "Сколько новых машин добавить (0 — само: заполнение до 5500, потом раз в неделю)"
        default: "0"

# Один прогон за раз: запуск по расписанию ждёт, пока закончится предыдущий
# (два параллельных прогона — двойная нагрузка на сайт-источник и риск блокировки)
concurrency:
  group: encar-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 1000 машин порциями по 100 с паузой 10 минут между ними (≈1,5 часа пауз) плюс
    # поиск по всем моделям — до 6 часов, это предел GitHub
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: scraper
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: scraper
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper and push to bn-auto
        working-directory: scraper
        env:
          PYTHONIOENCODING: utf-8
          # Лог виден сразу, а не только после завершения
          PYTHONUNBUFFERED: "1"
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # 0 — само: до заполнения каталога по 1000 за прогон, потом раз в неделю
          ENCAR_TOTAL: ${{ inputs.total || '0' }}
        run: |
          python scraper.py

      # Всегда, не только при ошибке: там сырые ответы API encar и сетевой
      # лог одной карточки — по ним дорабатывается разбор и справочник опций.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encar-debug
          path: scraper/debug
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/cars.json
          [ -f scraper/drom_cache.json ] && git add -f scraper/drom_cache.json
          git commit -m "chore: weekly data update [skip ci]" || { echo "No changes"; exit 0; }
          # Пока шёл сбор (часы), в main могли появиться другие коммиты — подтягиваем их
          # и пробуем ещё раз. cars.json меняет только этот шаг, конфликтов не будет.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
